# Cargo.toml — PCFM workspace root

[workspace]
resolver = "2"
members = [
    "crates/pcfm-core",
    "crates/pcfm-model",
    "crates/pcfm-hidden",
    "crates/pcfm-stats",
    "crates/pcfm-match",
]
default-members = ["crates/pcfm-core", "crates/pcfm-model", "crates/pcfm-hidden", "crates/pcfm-stats", "crates/pcfm-match"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["PC Football Manager Team"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/liraan/pcfootballmanager"
homepage = "https://github.com/liraan/pcfootballmanager"
documentation = "https://github.com/liraan/pcfootballmanager/tree/main/modules"

[workspace.dependencies]
# Internal
pcfm-core = { path = "crates/pcfm-core", version = "0.1.0" }
pcfm-model = { path = "crates/pcfm-model", version = "0.1.0" }
pcfm-hidden = { path = "crates/pcfm-hidden", version = "0.1.0" }
pcfm-stats = { path = "crates/pcfm-stats", version = "0.1.0" }
pcfm-match = { path = "crates/pcfm-match", version = "0.1.0" }
# RNG
rand_chacha = "0.9"
rand_core = "0.9"
blake3 = "1"
# Errors and serialisation
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
all = "warn"
correctness = "deny"
suspicious = "warn"
perf = "warn"
pedantic = "warn"
nursery = "warn"
