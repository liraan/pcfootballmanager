# Cargo.toml — PCFM workspace root

[workspace]
resolver = "2"
members = [
    "crates/pcfm-core",
]
default-members = ["crates/pcfm-core"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["PC Football Manager Team"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/liraan/pcfootballmanager"
homepage = "https://github.com/liraan/pcfootballmanager"
documentation = "https://github.com/liraan/pcfootballmanager/tree/main/modules"

[workspace.dependencies]
# The RNG crate: ChaCha20Rng, reproducible across platforms.
rand_chacha = "0.9"
# The traits used by ChaCha20Rng: SeedableRng, RngCore.
rand_core = "0.9"
# Cryptographic hash used for seed derivation. Deterministic, no random seed.
blake3 = "1"
# Error derive macro. Small, stable, no_std compatible.
thiserror = "2"
# Serialization. Used by IDs and, later, by MatchEvent and save files.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
all = "warn"
correctness = "deny"
suspicious = "warn"
perf = "warn"
pedantic = "warn"
nursery = "warn"
